name = "heldout_decode"
version = "0.1.0"
defaultTargets = ["DecodeProof"]

[[require]]
name = "aeneas"
path = "../tool-validation/trees/aeneas-final/backends/lean"

[[lean_lib]]
name = "DecodeModel"
roots = ["DecodeModel.DecodeModel"]

[[lean_lib]]
name = "DecodeProof"

# Negative control (scripts/check-negative.sh): model of a mutated candidate.
[[lean_lib]]
name = "DecodeModelNeg"
roots = ["DecodeModelNeg.DecodeModelNeg"]

# Final verification (final-verification/): extended model with the public decode / decode_vec
# entry points, the existing proof re-checked on it (generated), and the new API theorems.
[[lean_lib]]
name = "DecodeApiModel"
srcDir = "../final-verification/lean"
roots = ["DecodeApiModel.DecodeApiModel"]

[[lean_lib]]
name = "DecodeApiBase"
srcDir = "../final-verification/lean"

[[lean_lib]]
name = "DecodeApiProof"
srcDir = "../final-verification/lean"

# Negative controls of the final verification (final-verification/check-negative-api.sh).
[[lean_lib]]
name = "DecodeApiModelNeg"
srcDir = "../final-verification/lean"
roots = ["DecodeApiModelNeg.DecodeApiModelNeg"]

[[lean_lib]]
name = "DecodeApiModelNeg2"
srcDir = "../final-verification/lean"
roots = ["DecodeApiModelNeg2.DecodeApiModelNeg2"]
