name = "equivalence"
version = "0.1.0"
defaultTargets = ["Proofs"]

[[require]]
name = "aeneas"
path = "../env/aeneas/backends/lean"

[[lean_lib]]
name = "Proofs"

[[lean_lib]]
name = "Base64Ref"
roots = ["Base64Ref.Base64"]

[[lean_lib]]
name = "Base64Opt"
roots = ["Base64Opt.Base64"]

[[lean_lib]]
name = "Lz4Ref"
roots = ["Lz4Ref.Lz4"]

[[lean_lib]]
name = "Lz4Opt"
roots = ["Lz4Opt.Lz4"]

[[lean_lib]]
name = "Lz4Negative"
roots = ["Lz4Negative.Lz4Negative"]

[[lean_lib]]
name = "Base64PairsValue"
roots = ["Base64PairsValue.Base64PairsValue"]

[[lean_lib]]
name = "Lz4CopyRef"
roots = ["Lz4CopyRef.Lz4CopyRef"]

[[lean_lib]]
name = "Lz4CopyOpt"
roots = ["Lz4CopyOpt.Lz4CopyOpt"]

[[lean_lib]]
name = "Base64Ascii"
roots = ["Base64Ascii.Base64Ascii"]

[[lean_lib]]
name = "Base64ApiPartialRef"
roots = ["Base64ApiPartialRef.Base64ApiPartialRef"]

[[lean_lib]]
name = "Base64ApiPartialOpt"
roots = ["Base64ApiPartialOpt.Base64ApiPartialOpt"]

[[lean_lib]]
name = "PairTableInit"

[[lean_lib]]
name = "PairEmissionProof"

[[lean_lib]]
name = "Base64StepRef"
roots = ["Base64StepRef.Base64StepRef"]

[[lean_lib]]
name = "Base64StepOpt"
roots = ["Base64StepOpt.Base64StepOpt"]

[[lean_lib]]
name = "Base64FastStepProof"

[[lean_lib]]
name = "TailPairProof"

[[lean_lib]]
name = "Base64TailOpt"
roots = ["Base64TailOpt.Base64TailOpt"]

[[lean_lib]]
name = "Base64TailProof"

[[lean_lib]]
name = "Base64PublicRef"
roots = ["Base64PublicRef.Base64PublicRef"]

[[lean_lib]]
name = "Base64PublicOpt"
roots = ["Base64PublicOpt.Base64PublicOpt"]

[[lean_lib]]
name = "Base64Unroll8Opt"
roots = ["Base64Unroll8Opt.Base64Unroll8Opt"]

[[lean_lib]]
name = "Base64GroupProof"

[[lean_lib]]
name = "Base64Unroll8StepProof"

[[lean_lib]]
name = "Base64LoopGroupProof"

[[lean_lib]]
name = "Base64RemainderProof"

[[lean_lib]]
name = "Base64Unroll8Proof"

[[lean_lib]]
name = "Base64Unroll8PublicRef"
roots = ["Base64Unroll8PublicRef.Base64Unroll8PublicRef"]

[[lean_lib]]
name = "Base64Unroll8PublicOpt"
roots = ["Base64Unroll8PublicOpt.Base64Unroll8PublicOpt"]

[[lean_lib]]
name = "Base64CapacityProof"
